name: Hikvision Домофон
description: Локальное подключение домофона Hikvision к Home Assistant через MQTT
version: '3.0.36'
image: ghcr.io/akinin/hikvision-doorbell
slug: hikvision_doorbell
url: https://github.com/akinin/Hikvision-Addons/tree/main/doorbell
arch:
- amd64
- aarch64
stage: stable
startup: application
boot: auto
stdin: true
map:
  - media:rw

# Default options when used as an HA App
options:
  doorbells:
    - name: ""
      ip: ""
      username: admin
      password: ""
      scenes: false
  system:
    log_level: INFO
    sdk_log_level: NONE
  mqtt: {}

# Schema for the options above
schema:
  doorbells:
    - name: str
      ip: str
      port: "int?"
      username: str
      password: password
      output_relays: "int?"
      scenes: "bool?"
      call_state_poll: "int?"
      scene_state_poll: "int?"
      alarm_state_poll: "int?"
  system:
    log_level: match(^ERROR|WARNING|INFO|DEBUG$)
    sdk_log_level: match(^NONE|ERROR|INFO|DEBUG$)?
  mqtt:
    host: "str?"
    port: "int?"
    ssl: "bool?"
    username: "str?"
    password: "password?"

# To request MQTT configuration using the supervisor API
services:
  - "mqtt:need"
